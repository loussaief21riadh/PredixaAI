[alembic]

# Path to the Alembic migration environment.
script_location = %(here)s/alembic

# Add the backend directory to Python's import path.
prepend_sys_path = .

# Use the operating system path separator.
path_separator = os

# The real URL is replaced at runtime by alembic/env.py
# using app.core.settings.DATABASE_URL.
sqlalchemy.url = sqlite:///./sql_app.db


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
